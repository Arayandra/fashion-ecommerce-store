<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">E-Shop Fashion Store preview</title>
<desc id="desc">Illustrated fashion e-commerce storefront with navigation, search, campaign banner, category filters and product cards.</desc>
<defs>
